---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: drill-operator
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - drills.builtbyshailendra.dev
  resources:
  - drills
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - drills.builtbyshailendra.dev
  resources:
  - drills/finalizers
  verbs:
  - update
- apiGroups:
  - drills.builtbyshailendra.dev
  resources:
  - drills/status
  verbs:
  - get
  - patch
  - update

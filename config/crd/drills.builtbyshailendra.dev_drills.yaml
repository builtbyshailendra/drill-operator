---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: drills.drills.builtbyshailendra.dev
spec:
  group: drills.builtbyshailendra.dev
  names:
    kind: Drill
    listKind: DrillList
    plural: drills
    shortNames:
    - dr
    singular: drill
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.deployment
      name: Target
      type: string
    - jsonPath: .spec.action.type
      name: Action
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A Drill is a failure drill against one Deployment: break something on
          purpose, watch a guard, and stop early if the guard says the service is
          suffering. It answers "can this service lose N pods (or replicas) for a
          while and stay healthy?" with evidence instead of hope.

          The rules marked XValidation are CEL expressions. The Kubernetes API server
          itself enforces them, so a bad Drill is rejected by kubectl apply, before
          the operator ever sees it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              action:
                properties:
                  count:
                    description: Pods to delete, or replicas to remove.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  type:
                    enum:
                    - DeletePods
                    - ScaleDown
                    type: string
                required:
                - count
                - type
                type: object
              checkEvery:
                default: 5s
                description: How often to check the guard while observing.
                type: string
              guard:
                properties:
                  minReadyPods:
                    description: |-
                      The drill aborts if fewer target pods than this are Ready. It also
                      refuses to start if the action alone would take ready pods below it.
                    format: int32
                    minimum: 0
                    type: integer
                  prometheus:
                    description: 'Optional: abort if a Prometheus query goes above
                      a limit.'
                    properties:
                      maxValue:
                        description: The guard trips when the query's value is above
                          this, e.g. "0.05".
                        pattern: ^[0-9]+(\.[0-9]+)?$
                        type: string
                      query:
                        description: An instant query that returns one number, e.g.
                          an error ratio.
                        minLength: 1
                        type: string
                      url:
                        description: Base URL of the Prometheus HTTP API, e.g. http://prometheus.monitoring:9090
                        pattern: ^https?://[^\s]+$
                        type: string
                    required:
                    - maxValue
                    - query
                    - url
                    type: object
                required:
                - minReadyPods
                type: object
              observeFor:
                default: 60s
                description: |-
                  How long to watch the guard after the action. A ScaleDown is undone
                  at the end of this window. A pointer, not a value: metav1.Duration is a
                  struct, so `omitempty` never drops it and a Go client would always send
                  "0s", which skips the default (the first test run caught exactly that).
                type: string
              target:
                properties:
                  deployment:
                    description: |-
                      Name of a Deployment in the drill's namespace. Its pods are chosen
                      with the Deployment's own selector.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - deployment
                type: object
            required:
            - action
            - guard
            - target
            type: object
            x-kubernetes-validations:
            - message: a drill can't be changed once created; delete it and create
                a new one
              rule: self == oldSelf
            - message: checkEvery must not be longer than observeFor
              rule: duration(self.checkEvery) <= duration(self.observeFor)
            - message: observeFor can be at most 1h
              rule: duration(self.observeFor) <= duration('1h')
            - message: checkEvery must be at least 100ms
              rule: duration(self.checkEvery) >= duration('100ms')
          status:
            properties:
              actionAt:
                description: When the action was applied.
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                format: date-time
                type: string
              highestValue:
                description: The highest Prometheus guard value seen, as text.
                type: string
              lowestReadyPods:
                description: The lowest number of Ready target pods seen while observing.
                format: int32
                type: integer
              message:
                type: string
              originalReplicas:
                description: The Deployment's replicas before a ScaleDown, to put
                  back.
                format: int32
                type: integer
              phase:
                enum:
                - Pending
                - Injecting
                - Observing
                - Succeeded
                - Aborted
                - Rejected
                - Failed
                type: string
              restored:
                description: Whether a ScaleDown has been undone.
                type: boolean
              victims:
                description: |-
                  The pods chosen for deletion. Written before any pod is deleted, so a
                  retried reconcile deletes these same pods and never extra ones.
                items:
                  description: |-
                    Victim is a pod chosen for deletion. The UID matters: the pod is deleted
                    with a UID precondition, so if it's already gone and a new pod reuses the
                    name, the new one is left alone.
                  properties:
                    name:
                      type: string
                    uid:
                      type: string
                  required:
                  - name
                  - uid
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
